<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#f0f4ff"/>

  <!-- Table border -->
  <rect x="6" y="6" width="52" height="52" rx="3" fill="none" stroke="#3a6fd8" stroke-width="2"/>

  <!-- Header row background -->
  <rect x="6" y="6" width="52" height="14" rx="3" fill="#3a6fd8" opacity="0.15"/>

  <!-- Row header column background -->
  <rect x="6" y="6" width="20" height="52" rx="3" fill="#3a6fd8" opacity="0.1"/>

  <!-- Horizontal grid lines -->
  <line x1="6"  y1="20" x2="58" y2="20" stroke="#3a6fd8" stroke-width="1" opacity="0.5"/>
  <line x1="6"  y1="30" x2="58" y2="30" stroke="#d0d8ee" stroke-width="1"/>
  <!-- Sub-row dashed line within first row group -->
  <line x1="26" y1="35" x2="58" y2="35" stroke="#b0bcde" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="6"  y1="42" x2="58" y2="42" stroke="#d0d8ee" stroke-width="1"/>
  <line x1="6"  y1="50" x2="58" y2="50" stroke="#d0d8ee" stroke-width="1"/>

  <!-- Vertical grid lines -->
  <line x1="26" y1="6"  x2="26" y2="58" stroke="#3a6fd8" stroke-width="1" opacity="0.5"/>
  <line x1="42" y1="20" x2="42" y2="58" stroke="#d0d8ee" stroke-width="1"/>

  <!-- Header text placeholder bars -->
  <rect x="29" y="10" width="10" height="3" rx="1" fill="#3a6fd8" opacity="0.6"/>
  <rect x="45" y="10" width="10" height="3" rx="1" fill="#3a6fd8" opacity="0.6"/>

  <!-- Row dim values (left column) -->
  <rect x="9"  y="24" width="13" height="3" rx="1" fill="#4a5a8a" opacity="0.6"/>
  <rect x="9"  y="45" width="13" height="3" rx="1" fill="#4a5a8a" opacity="0.6"/>

  <!-- Cell values – first row group, first col (2 sub-rows) -->
  <rect x="29" y="24" width="9" height="3" rx="1" fill="#27ae60" opacity="0.75"/>
  <rect x="29" y="31" width="7" height="3" rx="1" fill="#e67e22" opacity="0.75"/>

  <!-- Cell values – first row group, second col -->
  <rect x="45" y="24" width="8" height="3" rx="1" fill="#2980b9" opacity="0.75"/>

  <!-- Cell values – second row group -->
  <rect x="29" y="45" width="10" height="3" rx="1" fill="#8e44ad" opacity="0.75"/>
  <rect x="45" y="45" width="7"  height="3" rx="1" fill="#c0392b" opacity="0.75"/>

  <!-- Multi-value indicator arrow (right side) -->
  <polyline points="56,24 59,27 56,30" fill="none" stroke="#3a6fd8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
